baseURL = "https://github.deokjong.com/"
languageCode = "ko-KR"
contentDir = "content"
enableEmoji = true
enableGitInfo = true
defaultContentLanguage = "ko"

[languages]
  [languages.ko]
    title = "진덕종"
    languageName = "한국어"
    weight = 10

[module]
  [module.hugoVersion]
    extended = true
    min = "0.140.0"
  replacements = "github.com/colinwilson/lotusdocs -> lotusdocs"
  [[module.imports]]
    path = "github.com/colinwilson/lotusdocs"
  [[module.imports]]
    path = "github.com/gohugoio/hugo-mod-bootstrap-scss/v5"

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.tableOfContents]
    endLevel = 3
    startLevel = 1
  [markup.goldmark.renderer]
    unsafe = true

[params]
  google_fonts = [["Inter", "300, 400, 600, 700"], ["Fira Code", "500, 700"]]
  sans_serif_font = "Inter"
  secondary_font = "Inter"
  mono_font = "Fira Code"

  [params.footer]
    copyright = "© :YEAR: 진덕종. [**Lotus Docs**](https://github.com/colinwilson/lotusdocs)로 제작"
  [params.social]
    github = "deokjong"
  [params.docs]
    title = "진덕종의 문서"
    darkMode = true
    prism = true
    prismTheme = "solarized-light"
    repoURL = "https://github.com/deokjong/deokjong.github.io"
    repoBranch = "main"
    editPage = true
    lastMod = true
    lastModRelative = true
    sidebarIcons = true
    breadcrumbs = true
    backToTop = true
    toc = true
    tocMobile = true
    scrollSpy = true
    descriptions = true
    titleIcon = true
    navDesc = true
    navDescTrunc = 30
    listDescTrunc = 100
    intLinkTooltip = true
  [params.flexsearch]
    enabled = true

[menu]
  [[menu.primary]]
    name = "문서"
    url = "docs/"
    identifier = "docs"
    weight = 10
